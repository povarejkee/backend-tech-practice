services:
  app-postgres:
    image: postgres:14.22-bookworm
    container_name: app-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
    - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
